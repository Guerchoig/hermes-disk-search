# hermes-disk-search - server-profile config TEMPLATE (rendered by `hds config init`)
#
# Both server installers call `hds config init` instead of building YAML by hand:
#   installers/install_server.ps1      (Windows)
#   installers/install_server.command  (macOS)
#
# Render rules (implemented once, in Rust - crates/hds-cli/src/cmd/config.rs):
#   * a line containing ${NAME} gets the value of that parameter;
#   * when the parameter is EMPTY, THE WHOLE LINE IS DROPPED (and a section header
#     left without children is dropped too);
#   * the result is parsed as YAML before anything is written - a broken template
#     or a broken value aborts the install instead of leaving a half-valid config.
#
# Placeholders: ${ACCESS_ENABLED} ${PARALLEL} ${GPU_PRESET} ${GPU_DEVICE}
#   ${ROOTS} ${EXCLUDE_PATHS} ${TRANSCRIBE_ENABLED} ${MEDIA_INBOX} ${MEDIA_OUT}
#   ${SOURCE_DISPOSAL} ${MCP_HOST} ${MCP_PORT} ${UI_HOST} ${UI_PORT}
#
# NOTE: this file is a SERVER template. The desktop install uses config.example.yaml
# (it is copied to config.yaml by setup.ps1 / install_macos.command); a server install
# never inherits it (see installers/install_app_version.ps1).
profile: server

# Authorization is controlled by access.enabled only (profile does NOT enable it).
access:
  enabled: ${ACCESS_ENABLED}
  token_ttl_days: 90

# Slots of the shared engine; the facade :8010-8012 stays local.
llm_server:
  parallel: ${PARALLEL}

# Pin the engine to a card: a preset (whole role layout) or a single device index.
gpu:
  preset: '${GPU_PRESET}'
  device_index: ${GPU_DEVICE}

index:
  # System/junk directories: never walked, never indexed. Keep this list in sync
  # with config.example.yaml (desktop template) - both stands must skip the same.
  exclude_dirs: ["$RECYCLE.BIN", "System Volume Information", "node_modules", ".git", ".venv", "venv", "__pycache__", "AppData", "Windows", "Windows.old", "Recovery", ".cache", ".npm", ".nuget", "packages", "hermes-disk-search-db", "WindowsApps", ".Trash", ".Trashes", "models"]
  # Directories to index (a whole drive is fine: 'D:\').
  roots: ${ROOTS}
  # Prefixes excluded as a whole; the auto-transcription folders land here too.
  exclude_paths: ${EXCLUDE_PATHS}
  # ASR language: 'ru' fixes Russian (without it whisper hallucinates English on silence);
  # '' means auto-detect (deliberate opt-out).
  whisper_language: 'ru'

# Auto-transcription service (hds transcribe-watch): inbox -> out_dir.
auto_transcribe:
  enabled: ${TRANSCRIBE_ENABLED}
  inbox_dir: '${MEDIA_INBOX}'
  out_dir: '${MEDIA_OUT}'
  diarization: true
  # An EXPLICIT backend is sent in the request body and overrides the diarization
  # section; when the key is absent (or '') the field is not sent and the host
  # picks diarization.backend -> auto (nemotron3 with a valid model, else sortformer).
  diarization_backend: 'nemotron3'
  # The key is sent in the request body and overrides the host's
  # `diarization.required` (nemotron3; the legacy sortformer path always fails hard).
  diarization_required: true
  source_disposal: ${SOURCE_DISPOSAL}
  # Re-transcribe (and overwrite the existing output) when the same file is
  # dropped into the inbox again: the product default since 0.22.0 - a newer
  # transcript must not silently shadow a re-dropped source. Set to false to
  # keep the first result instead.
  overwrite_existing: true
  pause_indexing: true

# Diarization: Nemotron-3 (Sortformer v3, up to 8 speakers) through parakeet-rs +
# ONNX Runtime. The model (400 MB, sha256 pinned in the binary) is installed by
# install_server -> installers/fetch_nemotron3_model.ps1 into the machine models
# dir (HDS_MODELS_DIR or %ProgramData%\hermes-disk-search\models). `sortformer`
# keeps the legacy engine path and stays a working fallback.
diarization:
  backend: 'nemotron3'      # nemotron3 | sortformer (legacy) | off
  required: true            # no model / failure => the job fails (no speech fallback)
  nemotron3:
    model: ''               # '' -> <models>/nemotron3/nemotron3_diar_v3.onnx
    device: auto            # auto | cpu | directml (Windows) | coreml (macOS)
    chunk_min: 10           # feed()/flush() block, minutes (2..=30)
    min_audio_min: 2        # shorter files always run on CPU
  asr:
    trim_leading_silence: true
    silence_threshold_db: -50
    trim_lead_in_sec: 0.3
    drop_silent_segments: true

# Python-sidecar transcription (P5): GigaAM-v3 + pyannote community-1 in
# <app>\sidecar\venv-transcribe[-dml]. The service runs as LocalSystem, so the
# models must live in the machine dir (HDS_MODELS_DIR / %ProgramData%); the
# installer pre-fetches them (installers/fetch_transcribe_models.ps1) and the
# worker then works with HF_HUB_OFFLINE=1. `engine: legacy` keeps the old Rust
# chain for one minor release (PLAN_PYTHON_SIDECAR_TRANSCRIBE §12).
transcribe:
  engine: python
  # auto -> cuda on NVIDIA, cpu on an integrated AMD/Intel GPU (DML is slower
  # there), dml on a discrete AMD/Intel card.
  profile: auto
  request_timeout_sec: 25200
  idle_unload_sec: 600
  max_requests: 20
  fallback_cpu: true
  max_duration_hours: 6
  state_dir: data/auto-transcribe
  models_dir: ''
  hf_token_env: HF_TOKEN
  asr:
    model: ai-sage/GigaAM-v3
    variant: e2e_rnnt
    backend: auto
    provider: auto
    device: auto
    onnx_dir: ''
  align:
    mode: native
    model: jonatasgrosman/wav2vec2-large-xlsr-53-russian
  diarization:
    enabled: true
    model: pyannote/speaker-diarization-community-1
    device: auto
  glossary:
    path: ''
  llm:
    enabled: false

# Publish /mcp and /ui only through a reverse proxy with TLS.
mcp_http:
  host: '${MCP_HOST}'
  port: ${MCP_PORT}
ui:
  host: '${UI_HOST}'
  port: ${UI_PORT}
