# Sample nginx reverse proxy for hermes-disk-search (M3 T1,
# PLAN_M3_NETWORK_PERIMETER.md par. 3.1).
#
# Only /mcp and /ui are published; TLS terminates at nginx; the app itself
# listens on 127.0.0.1. Facade ports 8010-8012 (/v1/*) are NOT published.
#
# After publishing, set `trusted_proxy: true` in config.yaml so the app
# honors X-Forwarded-For / X-Forwarded-Proto from this proxy.
#
# Install: copy to /etc/nginx/conf.d/hds.conf (or sites-available + symlink),
# put certificates, then: nginx -t && nginx -s reload

server {
    listen 443 ssl;
    server_name hds.example.com;

    ssl_certificate     /etc/letsencrypt/live/hds.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hds.example.com/privkey.pem;

    # MCP (Cline/Hermes clients): long RAG calls need a big timeout.
    location /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Admin UI (headless in server profile).
    location /ui {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (including /v1/* -> 8010-8012) is refused.
    location / {
        return 404;
    }
}