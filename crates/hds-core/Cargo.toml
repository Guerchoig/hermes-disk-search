# hds-core — общий слой трека B (MIGRATION_PLAN_RUST.md §2.4): config.yaml,
# схема/подключение index.db (rusqlite + sqlite-vec + FTS5), пути проекта.
# Крейт лежит в цепочке hds-core ← hds-index ← hds-cli (§2.4); зависимостей
# на hds-llama НЕТ (фасад — только по HTTP).
[package]
name = "hds-core"
description = "Общий слой ядра: config.yaml, index.db (rusqlite + sqlite-vec + FTS5), пути"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite.workspace = true
sqlite-vec.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
hex.workspace = true
# T1 (PLAN_M1_ACCESS_PROJECTS.md §3.2/§3.3): пароли Argon2id, токены sha256/getrandom.
argon2.workspace = true
rand_core.workspace = true
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
# M5 T2 (PLAN_M5_EXTERNAL_CHAT.md §3.3): TLS-клиент для внешнего chat-API
# (chat.provider: remote). Только исходящие; входящие серверы без TLS
# (периметр = reverse-proxy, M3). ring — без aws-lc-rs (сборка проще).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

[dev-dependencies]
# OpenFlags/Connection для тестов паритета (боевая БД, read-only)
rusqlite.workspace = true