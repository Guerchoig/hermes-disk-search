# hds-anonymize — типизированный клиент Python-воркера анонимизации
# (PLAN_ANONYMIZER_SIDECAR.md §2.3). Транспорт переиспользуем из
# `hds-extract` (`Worker`), доменные типы и маппинг ошибок — здесь.
[package]
name = "hds-anonymize"
description = "Клиент sidecar-воркера анонимизации/деанонимизации документов (JSON-RPC 2.0 stdio)"
version.workspace = true
