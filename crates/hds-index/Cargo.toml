# hds-index — трек B плана W2 (PLAN_W2_LLM_HOST.md §5): обход/лимиты/exclude,
# content_hash, далее — чанкер, конвейер process_file, watcher, prune.
[package]
name = "hds-index"
description = "Ядро индексации: обход файлов, исключения, лимиты, content_hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
hds-core = { path = "../hds-core" }
hds-extract = { path = "../hds-extract" }
hds-clip = { path = "../hds-clip" }
# W5: константы/проверка модели Nemotron-3 (размер, sha256) и поиск пути по
# каталогам моделей — один источник истины для `llm_host` и `hds check`.
# Новых внешних зависимостей не добавляет: `hds-diarize` уже в бинарях `hds`
# (через `hds-ui → hds-llama`) и `llm_host` (PLAN_DIARIZATION_NEMOTRON.md W5).
hds-diarize = { path = "../hds-diarize" }
# каталоги движка/моделей OpenResearchTools (как в hds-llama/hds-ui)
directories.workspace = true
rusqlite.workspace = true
blake2.workspace = true
hex.workspace = true
walkdir.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
# чтение golden-файлов чанкера (крупные лежат как .json.gz — см. slim_golden.py)
flate2 = "1"
