# hds-cli — CLI ядра индексации (MIGRATION_PLAN_RUST.md §2.4, §3.3; задача B7):
# db-move и подкоманды check/reindex/reindex-fts/forget/stop/clip-index/status/index.
# Крейт — библиотека + тонкий [[bin]] `hds` (свой разбор argv: `clap` недоступен
# offline, tools/parity/README.md §3 п. 13). Зависимостей на hds-llama НЕТ —
# фасад `:8010–8012` используется только по HTTP (hds_core::http).
[package]
name = "hds-cli"
description = "CLI ядра: db-move, status, check, reindex, reindex-fts, forget, stop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
hds-core = { path = "../hds-core" }
hds-index = { path = "../hds-index" }
hds-extract = { path = "../hds-extract" }
# P1: `transcribe-check` (probe Python-стека) — типизированный клиент воркера.
hds-transcribe = { path = "../hds-transcribe" }
# P4: `hds anon` — клиент воркера анонимизации (PLAN_ANONYMIZER_SIDECAR.md §2.4).
hds-anonymize = { path = "../hds-anonymize" }
hds-clip = { path = "../hds-clip" }
hds-search = { path = "../hds-search" }
hds-mcp = { path = "../hds-mcp" }
hds-ui = { path = "../hds-ui" }
rusqlite.workspace = true
serde_json.workspace = true
# `hds config init`: разбор/валидация отрендеренного серверного конфига
serde_yaml.workspace = true

# M2 T4: службы Windows — SCM-протокол для `hds service run <role>`
# (спайк 07.10.2026: crates.io доступен, windows-service 0.8.1 скачивается;
# скачается в кэш при первой сборке — далее работает офлайн).
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
# тест `config_init.rs` разбирает отрендеренный конфиг как YAML
serde_yaml.workspace = true
# F7: `ort_env_singleton.rs` проверяет, что CLIP и диаризация в одном процессе
# (§ревью M4) используют общее ONNX-окружение `hds-ort`.
hds-diarize = { path = "../hds-diarize" }

[[bin]]
name = "hds"
path = "src/main.rs"
