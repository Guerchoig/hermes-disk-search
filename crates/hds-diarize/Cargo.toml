# hds-diarize — диаризация Nemotron-3 (Sortformer v3) через `parakeet-rs`/ONNX Runtime
# (PLAN_DIARIZATION_NEMOTRON.md W0/W3), плюс PCM-утилиты общего назначения:
# разбор/запись WAV, декодирование медиа через CLI `ffmpeg` (вариант A — один проход),
# энергетический VAD для обрезки ведущей тишины и отбраковки «реплик из тишины».
#
# W0: крейт родился без `parakeet-rs` (WAV/VAD/декодер). W2 добавил ONNX Runtime
# (`parakeet-rs` + `ort_env`), W3 добавляет сам `Sortformer` и сшивку с ASR.
[package]
name = "hds-diarize"
description = "Диаризация Nemotron-3 (Sortformer v3) + WAV/VAD/декодер (variant A)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
# Проверка sha256 модели Nemotron-3 (W3): хешер уже в воркспейсе.
sha2.workspace = true
# Каталог моделей (`%APPDATA%\OpenResearchTools\models`, как у движка).
directories.workspace = true
# W2/W3: Nemotron-3 (Sortformer v3) через parakeet-rs. Версия пинована точно:
# крейт молодой (API менялся между 0.3/0.4), а он тянет `ort = "=2.0.0-rc.15"` —
# ту же версию, что `hds-clip` (одна на воркспейс). Дефолтные фичи parakeet-rs
# (`cpu`, `ort-defaults`, `api-28`) нужны: `ort-defaults` включает
# `download-binaries`/`copy-dylibs` — иначе ONNX Runtime не подхватится.
parakeet-rs = { version = "=0.4.2", features = ["sortformer"] }

[target.'cfg(windows)'.dependencies]
parakeet-rs = { version = "=0.4.2", features = ["sortformer", "directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
parakeet-rs = { version = "=0.4.2", features = ["sortformer", "coreml"] }

[[bin]]
name = "diar_wav_probe"
path = "src/bin/diar_wav_probe.rs"
