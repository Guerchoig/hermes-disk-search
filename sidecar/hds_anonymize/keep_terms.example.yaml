# keep_terms.example.yaml — список «не анонимизировать» (D19, правка плана П-14).
#
# Стартовый список подмешивается в базу меток при создании (vault.py,
# DEFAULT_KEEP_TERMS); файл — для расширения без правки кода:
#   python worker.py ... --keep-terms <этот файл>
#
# Синтаксис:
#   - значение            точное совпадение без учёта регистра;
#   - re:шаблон           регулярное выражение (fullmatch, без учёта регистра);
#   - составные термины   компоненты длиной ≥ 3 символов тоже считаются
#                         «своими»: «1С:ERP» → ERP, «1С:ЗУП» → ЗУП
#                         (NER режет названия продуктов на части).
#
# Зачем: NER иначе метит ТЗ/ЗУП/1С/Документооборот/ДиректБанк/ГИС МТ как
# ORG/LOC, а коды REQ-… — как INN/PASSPORT (факт A0, AGENT_SPIKES.md §3.9),
# и агент теряет предметную область проекта.

keep_terms:
  # фирма и платформа
  - 1С
  - 1С:Предприятие
  - 1С:ERP
  - 1С:ERP 2.5
  - 1С:Бухгалтерия
  - 1С:ЗУП
  - 1С:Документооборот
  - 1С:УТ
  - 1С:УНФ
  # короткие имена продуктов (в текстах — без префикса «1С:»)
  - ЗУП
  - УТ
  - УТ 11
  - УНФ
  - Документооборот
  - ДиректБанк
  - ГИС МТ
  # термины проекта внедрения
  - ТЗ
  - ТЭО
  - ФТТ
  - HTTP-сервис
  - RLS
  - регламентное задание
  - ERPLY
  - СБИС
  # коды требований — шаблон, а не значение
  - re:REQ-\d+
