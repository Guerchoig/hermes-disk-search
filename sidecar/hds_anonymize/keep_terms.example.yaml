# keep_terms.example.yaml — список «не анонимизировать» (D19, П-14).
#
# Стартовый список подмешивается в базу меток при создании (vault.py,
# DEFAULT_KEEP_TERMS); файл — для расширения без правки кода:
#   python worker.py ... --keep-terms <этот файл>
#
# Синтаксис:
#   - значение            точное совпадение без учёта регистра;
#   - cs:значение         точное совпадение С учётом регистра (короткие
#                         аббревиатуры, совпадающие с русскими словами:
#                         ДО ↔ «до», КА ↔ «ка»);
#   - re:шаблон           регулярное выражение (fullmatch, без учёта регистра);
#   - составные термины   компоненты длиной ≥ 3 символов тоже считаются
#                         «своими»: «1С:ERP» → ERP, «1С:ЗУП» → ЗУП
#                         (NER режет названия продуктов на части).
#
# Состав продуктов 1С согласован владельцем 17.11.2026. Зачем: NER иначе метит
# ТЗ/ЗУП/1С/Документооборот/ДиректБанк/ГИС МТ как ORG/LOC, а коды REQ-… — как
# INN/PASSPORT (факт A0, AGENT_SPIKES.md §3.9), и агент теряет предметную область.

keep_terms:
  # платформа и фирма
  - 1С
  - 1С:Предприятие
  - 1С:Fresh
  - 1С:Фреш
  # прикладные продукты 1С (полные и короткие имена)
  - 1С:БП
  - БП
  - 1С:ЗУП
  - ЗУП
  - 1С:УТ
  - УТ
  - УТ 11
  - 1С:УНФ
  - УНФ
  - 1С:КА
  - cs:КА
  - 1С:ERP
  - 1С:ERP 2.5
  - ЕРП
  - 1С:УПП
  - 1С:ДО
  - cs:ДО
  - 1С:Документооборот
  - Документооборот
  - 1С:УХ
  - 1С:ERP УХ
  - 1С:Розница
  - РТ
  - 1С:WMS
  - 1С:TMS
  - 1С:ТОИР
  - 1С:ИТС
  - 1С:ЭДО
  - 1С:БСП
  # прочие продукты и сервисы проекта
  - ДиректБанк
  - ГИС МТ
  - ERPLY
  - СБИС
  # термины проекта внедрения
  - ТЗ
  - ТЭО
  - ФТТ
  - HTTP-сервис
  - RLS
  - регламентное задание
  # коды требований — шаблон, а не значение
  - re:REQ-\d+
