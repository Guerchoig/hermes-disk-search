# hermes-disk-search — образец конфигурации
# Либо скопируйте этот файл в config.yaml и поправьте пути,
# либо просто запустите `python -m hds.cli check` / веб-интерфейс —
# config.yaml создастся автоматически с настройками по умолчанию.
index:
  roots:
    - 'C:\Users\имя_пользователя'    # корни индексации (диски/папки)
    # Проекты (M1): имя проекта можно задать явно, иначе — младшая папка
    # корня; для корня диска — метка с двоеточием (`D:\` → `D:`):
    # - 'E:\Archive'                                   # project = "Archive"
    # - { path: 'D:\Work\Sales', project: 'Sales' }    # тот же проект — другой корень
  exclude_dirs: ["$RECYCLE.BIN", "System Volume Information", "node_modules", ".git", ".venv", "venv", "__pycache__", "AppData", "Windows", "Windows.old", "Recovery", ".cache", ".npm", ".nuget", "packages", "hermes-disk-search-db", "WindowsApps", ".Trash", ".Trashes", "models"]
  # исключаемые пути-префиксы (каталог или файл целиком; редактируется в UI).
  # Каталоги автотранскрибации (`auto_transcribe.inbox_dir`/`out_dir`/`state_dir`) исключаются
  # из индексации НЕЯВНО (рантайм) — дублировать их здесь не обязательно. Пример:
  # exclude_paths:
  #   - 'D:\media-in'
  #   - 'D:\media-out'
  exclude_paths: []
  max_file_mb: 200          # предел для обычных файлов
  max_media_mb: 2500        # предел для аудио/видео (транскрипция)
  ocr: true                 # OCR картинок и пустых страниц PDF (нужен Tesseract)
  ocr_lang: "rus+eng"
  ocr_tesseract_cmd: ""     # путь к tesseract(.exe), если не в PATH (найден и в
                            # стандартных каталогах: %ProgramFiles%\Tesseract-OCR)
  ocr_tessdata: ""          # каталог языковых пакетов (*.traineddata), если он НЕ
                            # рядом с tesseract и не в %LOCALAPPDATA%\Tesseract-OCR
                            # \tessdata. Нужен службам: их %LOCALAPPDATA% — системный
                            # профиль, поэтому пользовательский tessdata не виден.
  ffmpeg_cmd: ""            # путь к ffmpeg(.exe) для legacy Python-путей
                            # (hds/extract_av.py, whisper.cpp). В Rust-конвейере
                            # медиа декодирует движок, CLI не требуется.
  transcribe: false         # устарел (legacy): ASR вынесена из индексации, медиа пропускается.
                            # Транскрибацию настраивайте в секции `auto_transcribe` (см. ниже).
  whisper_model: small
  whisper_device: auto      # auto | cuda | vulkan | cpu | metal
  whisper_load_timeout: 180 # сек; зависание CUDA-загрузки — fallback на CPU
  whisper_batch: 8          # батчевая транскрипция (0 = отключить)
  whisper_language: "ru"    # "ru" — фиксировать русский (по умолчанию продукта:
                            # без фиксации whisper на тишине/интро выдаёт английские
                            # галлюцинации «Thank you.»/«Obrigado.»); "" = авто-детекция
  # W3: медиа-ветка ядра на Rust (ASR-движок openresearchtools; владелец GPU — llm-host)
  whisper_mode: subtitle    # subtitle (таймкоды, .srt) | speech (сплошной текст)
  whisper_custom: "4.5"     # окно субтитров, сек (subtitle); "default"/"auto"/число
  whisper_gpu: 0            # индекс GPU движка (или -1 — CPU)
  transcribe_url: "http://127.0.0.1:8010"  # владелец GPU (POST /internal/transcribe)
  clip: true                # CLIP-поиск картинок по содержанию
  # W4: пути к ONNX-моделям CLIP. По умолчанию ищутся в models\clip_onnx
  # (кладёт установщик installers\fetch_clip_models.ps1); dev-фолбэк —
  # tools/parity/out/clip_onnx (экспорт W3). Явные пути переопределяют:
  # clip_vision_model: "…/clip_vision.onnx"
  # clip_text_model:   "…/clip_text_dense.onnx"
  # clip_tokenizer:    "…/tokenizer.json"
  max_chunks: 3000          # максимум чанков на файл (0 = без лимита)

# путь к индексной БД; относительный путь считается от корня проекта
db_path: 'index.db'

# --- БД под конкурентность (M4, PLAN_M4_CONCURRENCY_SLA.md §3.4) ---
# Дефолты по профилю: server — busy_timeout 5000, read_only_conns true;
# desktop — 30000/false (прежнее поведение). Читатели (MCP/UI/CLI-поиск) при
# read_only_conns: true открывают базу read-only, писатель — только конвейер
# индексации/watcher. Бэкап — только VACUUM INTO/.backup (WAL нельзя копировать
# файлом «на горячую»).
# db:
#   busy_timeout_ms: 5000    # ожидание блокировки SQLite, мс
#   read_only_conns: true    # читатели — read-only
#   journal_mode: wal        # режим журнала писателя (персистентен в файле БД)

chunk:
  size: 800                 # символов на чанк (≈400 токенов)
  overlap: 120              # перекрытие соседних чанков (целые предложения)

embedding:
  base_url: "http://127.0.0.1:8011/v1"   # роль embedding (владелец портов — llm-host)
  model: "text-embedding-bge-m3"         # имя модели в теле запроса /v1/embeddings (не путь)
  batch_size: 64
  dim: 1024                 # bge-m3 = 1024

chat:
  base_url: "http://127.0.0.1:8010/v1"
  model: "chat"             # имя модели в теле запроса (фасад /v1/models отдаёт chat|chat-think)
  # provider — источник RAG-ответа (M5 §3.2; контракт — PLAN_M4_CONCURRENCY_SLA.md §3.5):
  #   local (дефолт)  — чат-роль llm-host, base_url = фасад :8010;
  #   remote          — внешний OpenAI-совместимый API: RAG-ответ генерирует он,
  #                     llm-host НЕ поднимает chat-роль (VRAM освобождается —
  #                     «рычаг SLA» на 12 ГБ), embedding/rerank остаются локальными.
  # ВНИМАНИЕ: при remote текст вопроса и фрагменты локальных файлов уходят
  # провайдеру как есть — анонимизация (W9) ещё не реализована; включайте
  # remote только для доверенных API.
  # provider: local
  # api_key: ""             # Bearer-ключ внешнего API (только remote); "-" = без ключа.
  #                         # Файл config.yaml вне git (секрет); в диагностике не печатается.
  thinking: "off"           # off|auto: off — RAG-ответы без размышлений (быстро)
  temperature: 0.2
  max_tokens: 2048          # потолок вывода ОДНОГО ответа роли chat: дефолт llm-host, когда
                            # клиент (агент Cline и др.) не прислал свой max_tokens. У агента
                            # в этот потолок входят и размышления — при 600 токенов ответы
                            # обрывались на полуслове. Верхняя граница — ctx_per_slot слота.
  rag_max_tokens: 600       # отдельный потолок ответа ask_my_files (RAG): короче намеренно,
                            # этот ответ ждёт MCP-клиент (таймаут 300 с)
  max_context_chars: 14000  # бюджет символов на фрагменты в RAG-промпте (build_context):
                            # сколько найденных блоков войдёт в сообщение пользователю.
                            # В токенах ≈ /2.5; должно быть < ctx_per_slot минус запас
                            # на вопрос+ответ, иначе движок вернёт явную ошибку 400

llm_server:                 # роли LLM (движок openresearchtools); владелец портов — bin\llm_host.exe
  bin: ""
  host: "127.0.0.1"
  autostart: true
  start_timeout: 300
  # parallel — число СЛОТОВ чата (n_parallel llama-server). Дефолт по профилю:
  # server → 5 (SLA M4: 5 одновременных RAG), desktop → 1. Явное значение
  # сильнее дефолта. Общий контекст = parallel × ctx_per_slot, KV-кэш растёт
  # линейно по общим токенам. Если при старте чат не влезает в VRAM — llm-host
  # падает с ЯВНОЙ ошибкой «нужно/свободно» и подсказкой; рычаги: снизить
  # parallel, ctx_per_slot или задать llm.chat.n_batch: 512 (компактнее
  # compute-буфер, −1,5 ГиБ).
  # Замеры на RTX 3060 12 ГБ (08.10.2026, tools/parity/out/m4_slots_*.json;
  # замер: 5 одновременных запросов чата, ответ 300 токенов, KV q8_0):
  #   parallel 2, ctx_per_slot 32768 → VRAM 8129 МиБ, 5 запросов за 33,7 с (p95 ≈33)
  #   parallel 3, ctx_per_slot 32768 → VRAM 8723 МиБ, за 27,1 с (p95 ≈26,5)
  #   parallel 5, ctx_per_slot 16384 → VRAM 8553 МиБ, за 21,3 с (все параллельно)
  #   parallel 5, ctx_per_slot 32768 → ОТКАЗ гейта (нужно 10668 + резерв 1024 > 11385)
  # Итог: на 12 ГБ с живым рабочим столом — либо 5 слотов × 16384 токена
  # (тогда chat.max_context_chars ≲ 32000), либо 2–3 слота × 32768.
  # parallel: 5               # раскомментируйте, чтобы задать вручную
  # model — GGUF-файл инстанса роли. "shared:<role>" = модель из ОБЩЕГО llama-рантайма
  # машины (%LOCALAPPDATA%\llama-runtime\models\<role>\, манифест current.json):
  # один набор моделей и одна сборка движка на машину, смена активной модели
  # одной кнопкой. Явный путь тоже можно; относительный резолвится от
  # РАБОЧЕГО КАТАЛОГА процесса llm_host, поэтому надёжнее абсолютный.
  chat:
    port: 8010
    model: "shared:chat"
    # ctx_per_slot — контекст одного слота движка в ТОКЕНАХ (n_ctx llama-server):
    # физический KV-кэш (VRAM) и потолок «промпт + ответ» одного запроса.
    ctx_per_slot: 32768       # 32K подтверждено замером (W2_REPORT §7.2): модель гибридная,
                              #   KV держат 8 слоёв из 32 → 1024 МиБ при f16; «модель + KV»
                              #   ≈ 8492 МиБ → в 12 ГБ влезает (плюс SSM ≈50 МиБ и compute-буфер)
    extra_args: "--cache-type-k q8_0 --cache-type-v q8_0 -ngl 99"
  embedding:
    port: 8011
    model: "shared:embedding"
    ctx_per_slot: 8192        # контекст одного текста эмбеддинга (токены):
                              # чанки ~800 символов (~350 токенов) — с большим запасом
    # `--ubatch-size` — compute-буфер движка (n_ubatch × hidden × слои). 8192 при 12 ГБ
    # неразумен (≈1,4 ГиБ у bge-m3), 512 — дефолт llama.cpp и ~16× меньше.
    extra_args: "--batch-size 8192 --ubatch-size 512 -ngl 99"
  rerank:
    port: 8012
    model: "shared:rerank"
    ctx_per_slot: 8192        # контекст одной пары «запрос + фрагмент» при реранкинге (токены)
    extra_args: "-ngl 0"

# Слой резидента llm-host: llm.<role>.* приоритетнее llm_server.<role>.*
# (model, port, n_ctx, retention, grace_seconds, n_batch, n_ubatch, n_threads,
#  cache_type_k/v; llm.model_policy — fixed|auto). Без llm.<role>.n_batch/n_ubatch
# батчи берутся дефолтом движка (2048) — compute-буфер чата ≈ +1,5 ГиБ VRAM
# (замер W2_REPORT §10.2a: 2048 → 9384 МиБ, 512 → 7881 МиБ), поэтому 512.
llm:
  chat:
    n_batch: 512
    n_ubatch: 512
  # embedding: { n_ctx: 8192, retention: load_on_demand, cache_type_k: "q8_0" }
  # Ретенция по умолчанию (M5 T0.1/F1): chat — keep_loaded всегда; embedding и
  # rerank — keep_loaded в профиле server, load_on_demand в desktop. Почему:
  # перезагрузка роли при тесной VRAM идёт через fit-шаг движка, который при
  # «свободно ~1,9 ГиБ» завершается ~299 с (замер f1_r1/r2, 09-10.10.2026) —
  # unlucky-запрос ждал её целиком (выброс p95 315 с). Держим роли в VRAM —
  # перезагрузок нет; прогрев embedding/rerank выполняется при старте llm-host
  # в server-профиле. Явный llm.<role>.retention сильнее дефолта профиля.

# GPU и диспетчер VRAM (W2, A4; все ключи необязательные — ниже значения по умолчанию)
gpu:
  policy: query_priority     # query_priority | indexing_priority | manual:
                             #   query     — запрос важнее: индексация встаёт на паузу,
                             #               индексные роли выгружаются по приоритетам;
                             #   indexing  — индекс важнее: роли не вытесняем, запрос ждёт;
                             #   manual    — ничего не делаем сами, только отчёт
  device_index: 1            # 0 = CPU, 1 = первый GPU (без явного выбора движок уйдёт на CPU, R32)
  # M6 T4 (PLAN_M6_GPU_MULTIVENDOR.md §3.4): пресеты раскладки и автодетект.
  # Пресеты ВЕНДОР-ГОМОГЕННЫЕ: `nvidia-one` (всё на первую карту), `nvidia-n`,
  # `amd-n` (чат-реплики и whisper — по картам round-robin, индексация
  # `embedding`/`rerank` — одним экземпляром на выделенной карте), `apple`
  # (Metal, всё на первую). Пресет раскладывает ТОЛЬКО объявленные роли
  # (реплики `chat-N`/`whisper-N` объявляются явно, см. ниже).
  # Приоритет источников: `llm_server.<role>.device` → `gpu.devices` → `gpu.preset`
  # → `gpu.autodetect` → компат `gpu.device_index` (§3.1/§3.4). Любая раскладка
  # печатается с числами (лог llm-host, `llm_host_plan`, `hds check`); секретов не
  # печатаем. Смешанные вендоры и iGPU/UMA не поддерживаются (§2): пресет на
  # «чужих» картах — fail-fast, `hds check` (пункт `gpu_roles`) подсказывает
  # уместный пресет и число ускорителей.
  # preset: nvidia-n          # none | nvidia-one | nvidia-n | amd-n | apple
  # autodetect: false         # по умолчанию выключен: раскладка только по явному ключу
  # M6 (PLAN_M6_GPU_MULTIVENDOR.md §3.1): раскладка ролей по картам. Задана —
  # назначенные роли идут на свои карты, остальные — на device_index (компат).
  # Индексы — НАШИ (0 = CPU, 1..N = ускорители в порядке `llm-host devices`).
  # ⚠ С Vulkan-бэкендом порядок ускорителей отличается от CUDA-сборки — проверяйте
  # `llm-host devices`; одна роль работает ровно на одной карте; embedding/rerank
  # легально делят карту с чатом («лёгкая добавка»), whisper — не более одного на карту.
  # devices:
  #   - { index: 1, roles: [chat] }
  #   - { index: 2, roles: [embedding, rerank] }
  # Точечная альтернатива — карта роли ключом (приоритетнее gpu.devices):
  # llm_server:
  #   chat: { device: 1 }
  #
  # M6 T2 (§3.5/§3.6): чат-реплики и транскрибация по картам.
  # * чат-реплики (`chat-2`, `chat-3`, …) — ОДИНАКОВЫЕ инстансы (одна модель и
  #   контекст, различаются портом и слотами) под одновременные запросы разных
  #   пользователей; допустимы на одной карте (делят её VRAM) и на разных.
  #   Наружу публикуется ОДИН фасад (chat → 8010): запрос раскидывает сам
  #   llm-host — least-busy, при равенстве round-robin. Порты реплик внутренние/
  #   диагностические (дефолт `8010+N`), в `hds check`/`status` печатаются как
  #   справочные. Порт реплики обязан быть уникальным: при совпадении с базовой
  #   ролью (8011/8012) задайте явно — иначе fail-fast с числами.
  # llm_server:
  #   parallel: 5                     # слоты на каждую чат-реплику
  #   chat:    { port: 8010, model: "shared:chat" }
  #   chat-2:  { port: 8030, model: "shared:chat" }   # вторая реплика (одна модель)
  # llm:
  #   chat-2: { n_ctx: 32768 }        # при необходимости — свой контекст
  #
  # * индексация (`embedding`/`rerank`) — РОВНО ОДИН экземпляр на машину
  #   (§3.5): реплика вида `embedding-2` — ошибка конфига (fail-fast с числами),
  #   «один набор моделей индексации обрабатывает один файл одновременно».
  # * транскрибация (`whisper`, `whisper-2`, …) — экземпляр НА КАРТУ, один файл
  #   за раз; карту под файл выбирает llm-host по свободной VRAM (числа — в логе),
  #   разные файлы на разных картах идут параллельно (split одного файла отвергнут):
  # llm:
  #   whisper:   { model: "…\\whisper-large-v3-turbo-GGML.bin" }
  #   whisper-2: { model: "…\\whisper-large-v3-turbo-GGML.bin" }
  # gpu:
  #   devices:
  #     - { index: 1, roles: [chat, chat-2, embedding, rerank, whisper] }
  #     - { index: 2, roles: [whisper-2] }
  n_gpu_layers: -1           # -1 = все слои на GPU (приоритетнее legacy `-ngl` в extra_args)
  reserve_mb: 1024           # не выедаем под ноль
  evict_idle_sec: 600        # внешний предохранитель: простой роли → выгрузка
  abandoned_request_sec: 900 # страж брошенных запросов: вызов движка дольше 900 с (клиент
                             #   оборвал запрос, отмены в API движка нет) → штатная остановка
                             #   резидента, GPU освобождается; 0 = выключить
  pause_index_on_query: true # ставить index.pause, пока обслуживается запрос
  # vram_source: nvml        # источник истины по VRAM (R29); `engine` = list_devices, недостоверно
  # vram_budget_mb: 11000    # опционально: сузить бюджет (диагностика/критерий A-7)
  # external_vram_mb: 0      # вычет на чужих потребителей GPU (браузер, игры, другие LLM)
  priorities: { chat: 100, transcribe: 60, embedding: 40, rerank: 30, whisper: 20 }
                             # меньше число = выгружается раньше; роли вне списка → 0
                             # transcribe — псевдо-роль автотранскрибации (свой приоритет
                             # между поиском/чатом и индексацией, PLAN_AUTO_TRANSCRIBE)

# MCP-сервер в режиме streamable-http: ОДИН инстанс на машину (клиенты идут
# по URL). При stdio каждый клиент (Cline, Hermes, ...) поднимает свой процесс.
# --- Профиль (M2) ---
profile: desktop            # desktop | server (серверный профиль — с access.enabled: true)
# --- Доступ (M1, PLAN_M1_ACCESS_PROJECTS.md) ---
access:
  enabled: false            # true = Bearer-токены обязательны (hds-mcp/hds-ui), 401 без токена
  token_ttl_days: 90        # TTL авто-выданных токенов (users/tokens в data/access.yaml)
# --- Серверный профиль (M2, PLAN_M2_SERVER_PROFILE.md §3) ---
# profile: desktop (по умолчанию) — одиночная машина: состояние рядом с программой,
#   автозапуск — задачи Планировщика по входу пользователя (AtLogOn).
# profile: server — серверный режим: состояние в системном каталоге
#   (%ProgramData%\hermes-disk-search / /Library/Application Support/hermes-disk-search),
#   службы без интерактивного входа (`hds service ...`), headless-UI.
#   Сам по себе profile авторизацию НЕ включает — доступ задаёт access.enabled.
# --- Bind веб-интерфейса (M2 T3): hds ui слушает ui.host:ui.port;
# флаги --host/--port CLI переопределяют. В server-профиле держите 127.0.0.1 —
# наружу публикует reverse-proxy (фасад :8010–8012 не публикуется).
ui:
  host: "127.0.0.1"
  port: 8765
mcp_http:
  host: "127.0.0.1"
  port: 8787
  path: "/mcp"               # streamable-http endpoint
  autostart: true            # поднимать при старте UI/MCP/cli (живой переиспользуется)
  start_timeout: 30          # сек ожидания /health при старте
# --- Reverse-proxy (M3, PLAN_M3_NETWORK_PERIMETER.md §3.1): наружу только
# /mcp и /ui через Caddy/nginx с TLS (образцы — installers/proxy/), фасад
# :8010–8012 не публикуется. Пока клиенты ходят напрямую — false. ---
trusted_proxy: false        # true = доверять X-Forwarded-For/Proto от прокси:
                            #   аудит и rate-limit видят реальный IP клиента.
                            #   Включайте только если прямого доступа к
                            #   :8787/:8765 снаружи нет — иначе IP подделывают
                            #   заголовком
# --- Сетевая обвязка (M3 T4): лимиты на встроенных HTTP-серверах (MCP и UI). ---
# http:
#   max_body_kb: 512         # 413 при превышении (0 — без лимита; не рекомендуется)
#   max_conns: 32            # сверх предела — короткий 503 без спавна потоков (0 — без предела)
# --- Rate-limit (M3 §3.3, квоты — M4 T4 §3.3): token-bucket на MCP и UI.
# Ключ — ПОЛЬЗОВАТЕЛЬ (`user:<login>` по валидному Bearer, иначе IP): у
# пользователя с двумя токенами квота не удваивается (M3 F10.3);
# `per_token: true` возвращает пер-токенный ключ M3. Превышение -> 429 +
# Retry-After; /auth/login ограничен жёстче (антибрутфорс, всегда по IP).
# Лимиты в памяти процесса: mcp-http и ui считаются независимо.
# Без ключа enabled: server — включён (дефолты ниже), desktop — выключен. ---
# rate_limit:
#   enabled: true            # true/false переопределяет профиль
#   requests_per_min: 120    # частота запросов на пользователя
#   burst: 30                # всплеск (ёмкость bucket)
#   login_per_min: 10        # POST /auth/login по IP (антибрутфорс)
#   max_inflight: 5          # параллельные тяжёлые запросы (ask_my_files) — глобально;
#                            #   дефолт по профилю: server 5 (= llm_server.parallel),
#                            #   desktop 4 (M5 T0.3/F3); держите >= llm_server.parallel,
#                            #   иначе слоты чата простаивают (hds check предупредит)
#   max_inflight_per_user: 2 # ...и на пользователя (M4 T4): 3-й одновременный RAG
#                            #   одного пользователя -> 429 + hint; в очереди (T3)
#                            #   это отдельный предел, проверяется в can_admit
#   requests_per_min_per_user: 120  # агрегат частоты на пользователя; применяется
#                            #   при per_token: true (иначе ключ уже пользователь);
#                            #   дефолт — как requests_per_min
#   per_token: false         # true = ключ лимитов — токен (поведение M3) ---
# --- Очередь тяжёлых RAG (M4 T3, §3.2): вместо мгновенного 429 запрос ЖДЁТ слот,
# справедливо распределяя его между пользователями (round-robin между
# пользователями, FIFO внутри; ключ — user:<login>, иначе ip:<addr>). Глубина
# ожидания — max_depth, потолок ожидания — wait_timeout_sec, лимит ИСПОЛНЕНИЯ —
# rate_limit.max_inflight (глобально) и rate_limit.max_inflight_per_user
# (на пользователя, M4 T4). Очередь переполнена -> 429 + Retry-After; не дождался
# -> 503 + Retry-After; обрыв клиента освобождает место. Очередь живёт в процессе
# `hds mcp-http` (админский ask в UI — вне неё); её статус (глубина, ожидание
# p50/p95, отказы, «кто кого ждёт») пишется в `<каталог состояния>/data/mcp-queue.json`
# и виден в `hds check`/`/api/diagnostics`.
# Дефолты: server — включена (20 / 240 / rr), desktop — выключена (поведение M3).
# wait_timeout_sec держите МЕНЬШЕ таймаута MCP-клиента (300 с), иначе 503 придёт
# позже, чем клиент оборвёт запрос. ---
# queue:
#   enabled: true            # true/false переопределяет профиль
#   max_depth: 20            # сколько запросов ЖДУТ (0 — ждать негде: сразу 429)
#   wait_timeout_sec: 240    # потолок ожидания слота (< 300 — таймаут клиента)
#   policy: rr               # rr (fair-share) | fifo (строго по времени прихода)


search:
  vec_k: 40
  fts_k: 40
  rrf_k: 60
  fts_weight: 1.0
  vec_weight: 1.0
  clip_weight: 1.0
  snippet_chars: 500

# --- Автотранскрибация + диаризация «входная папка → выходная» -----------------
# Демон `hds transcribe-watch` видит готовый медиафайл в inbox_dir, прогоняет
# транскрибацию+диаризацию движком (владелец GPU — llm-host), пишет `.md` с метками
# спикеров (SPEAKER_00, SPEAKER_01, …; неприсвоенные — UNASSIGNED) в out_dir и
# УДАЛЯЕТ исходник (только при успехе). UI: закладка «Транскрибация».
# Подробности: PLAN_AUTO_TRANSCRIBE.md (спайк формата — tools/parity/T0_1_DIARIZATION_FORMAT.md).
auto_transcribe:
  enabled: false              # включить конвейер (демон/задача Планировщика/служба)
  inbox_dir: 'D:\media_in'    # ВХОД:  исходные медиа (абсолютный путь)
  # ВЫХОД: транскрибированные/диаризованные выходы (.md). В индекс НЕ попадают:
  # демон их не индексирует (§8.1 плана) — при необходимости переносите `.md`
  # в индексируемые папки ВРУЧНУЮ. Папки конвейера (inbox_dir/out_dir/state_dir)
  # исключаются из индексации неявно — индикатор у полей в UI: «исключена ✓».
  out_dir:   'D:\media_out'
  recursive: false            # обходить подкаталоги inbox_dir
  # --- движок (перекрывают index.whisper_* только для этого конвейера) ---
  mode: transcript            # transcript = транскрибация + диаризация
  out_format: md              # как отдаёт движок (.md) — без конвертации
  unassigned_label: UNASSIGNED  # метка «спикер не определён» (как отдаёт движок)
  # --- диаризация ---
  diarization: true
  # Legacy-ветка (sortformer GGUF): действует, только если diarization.backend:
  # sortformer. Новый путь — секция `diarization` ниже (Nemotron-3, 8 спикеров).
  diarization_model: ''       # .gguf для sortformer; '' → автопоиск: HDS_MODELS_DIR →
                              # %ProgramData%\hermes-disk-search\models → %APPDATA%\OpenResearchTools\models
                              # (каталог *sortformer*) — порядок как у hds_diarize::models_roots
  diarization_backend: nemotron3  # ЯВНЫЙ backend уходит в тело запроса и сильнее секции
                                  # diarization; нет строки (или '') ⇒ поле не отправляется,
                                  # backend выбирает хост по diarization.backend → авто (№3)
  diarization_feed_ms: 10800001
  diarization_required: true  # нет модели ⇒ ЖЁСТКИЙ отказ задания (без fallback в speech);
                              # ключ уходит в теле и перекрывает diarization.required хоста
                              # (для nemotron3; legacy sortformer при сбое всё равно падает)
  whisper_model: ''           # '' → index.whisper_model / автопоиск движка
  whisper_gpu: -1             # -1 = как gpu.device_index; иначе индекс GPU движка
  # --- событие «файл помещён во входную папку» (§3 плана) ---
  debounce_seconds: 8         # размер файла не меняется N сек ⇒ файл «готов»
  max_stable_wait: 120        # потолок ожидания стабилизации, сек
  poll_seconds: 3             # период reconcile-обхода инбокса (страховка от пропусков)
  require_exclusive_read: true  # файл должен открываться на чтение (не занят писателем)
  extensions: []              # [] = все медиа (kinds.rs); иначе — только перечисленные
  ignore_suffixes: ['.part', '.tmp', '.crdownload', '.!qb', '.bak']
  # --- очередь/идемпотентность ---
  queue_file: 'data/auto-transcribe-queue.jsonl'
  state_dir: 'data/auto-transcribe'
  overwrite_existing: false   # перетранскрибировать, если выход уже есть и свежее
  max_attempts: 3
  source_disposal: delete     # после УСПЕХА: delete (удалять исходник) | keep | move
  source_disposal_dir: ''     # для source_disposal: move — каталог архива
  # --- объединение с индексацией (§7 плана) ---
  index_outputs: false        # устарел (legacy): выходы конвейера в индекс НЕ кладутся (§8.1)
  pause_indexing: true        # на время задания ставить index.pause (выше индексации)
  # --- кто и как запускает конвейер ---
  # desktop: задача Планировщика `HermesDiskSearchTranscribe` (`hds transcribe-watch`,
  #          ставит installers/install_autostart.ps1; модели — setup.ps1, блок
  #          «Automatic transcription»);
  # server:  служба `hermes-disk-search-transcribe` (`hds service start|stop transcribe`,
  #          зависимость от `...-llm-host`); UI-карточка сама показывает форму
  #          управления (service/task/process) и действия уводит в SCM.



# --- Транскрибация/диаризация на Python-sidecar (P1) --------------------------
# Новый боевой путь: GigaAM-v3 (e2e_rnnt, fp16 CUDA) + pyannote community-1.
#   engine: python — sidecar/hds_transcribe (venv профиля, отдельный процесс);
#   engine: legacy — прежняя цепочка через llm_host (index.whisper_*,
#                    auto_transcribe.diarization* — читаются и работают).
# Параметры передаются воркеру из Rust; Python config.yaml не читает.
# Решения P0: VAD Silero (окна ≤25 с), align.mode native, hotwords none, LLM off.
transcribe:
  engine: python
  # auto → cuda (основной профиль). cpu — fallback и правильный выбор для iGPU;
  # dml — код-путь/fallback, на встроенной AMD iGPU медленнее CPU в 2,2–2,5×.
  profile: auto                 # auto | cuda | cpu | dml
  request_timeout_sec: 25200    # 7 ч: длинная запись + запас
  idle_unload_sec: 600          # простой → освободить VRAM, процесс оставить
  max_requests: 20              # после N файлов — перезапуск воркера
  fallback_cpu: true            # cuda_oom/dml_oom/onnx_error → одна попытка на CPU
  max_duration_hours: 6
  state_dir: data/auto-transcribe  # transcript.json/diarization.json (не в out_dir)
  models_dir: ""                # "" → HDS_MODELS_DIR → installer-путь (ProgramData)
                                # база моделей и HF-кэша (<models_dir>/hf-home)
  hf_token_env: HF_TOKEN        # имя переменной с токеном gated-моделей
  asr:
    model: ai-sage/GigaAM-v3
    variant: e2e_rnnt           # e2e_rnnt | rnnt | e2e_ctc (последние — контроль)
    revision: ""                # "" = вариант; иначе локальный .ckpt/каталог со snapshot
                                # (HF-revision не применим: gigaam качает веса с CDN)
    language: ru                # "" = автоопределение
    device: auto                # auto | cuda | cpu
    backend: auto               # auto | torch | onnx (dml ⇒ onnx)
    provider: auto              # auto | cuda | dml | cpu (ORT EP при backend: onnx)
    device_id: 0                # DXGI-адаптер для DirectML (пин, §4.7)
    intra_threads: 0            # ONNX: 0 = авто (1 на GPU, 6 на CPU)
    batch_size: 8
    longform: off               # P1: transcribe_longform не используется
    vad: silero                 # silero | off
    max_chunk_sec: 25
    fp16: true                  # CUDA — да; CPU — нет
    cache_dir: ""               # "" → HDS_GIGAAM_CACHE → models/gigaam
    onnx_dir: ""                # "" → HDS_GIGAAM_ONNX → models/onnx/<variant>
  decode:
    channels: auto              # auto (корреляция L/R) | downmix | split
    ffmpeg: ""                  # "" → HDS_FFMPEG → PATH
    ffprobe: ""
    sample_rate: 16000          # фиксировано: другое значение не поддерживается
  align:
    mode: native                # native (default) | whisperx | hybrid (P2, только CUDA-venv)
    model: jonatasgrosman/wav2vec2-large-xlsr-53-russian  # WhisperX-модель для ru
    device: auto                # auto | cuda | cpu (на AMD/Intel — cpu)
    max_shift_sec: 0.35         # hybrid: расхождение native/whisperx → берём whisperx
    quality:                    # флаги слов и alignment_quality
      max_gap_sec: 1.5          # разрыв внутри фразы → low_confidence (не пауза между чанками)
      min_duration_sec: 0.02    # слово короче → low_confidence
      overlap_tolerance_sec: 0.12  # конфликт таймкодов соседних слов (3 кадра GigaAM по 40 мс)
      min_aligned_ratio: 0.80   # порог alignment_quality.ok по доле aligned
      max_unreliable_ratio: 0.02  # (low_confidence+failed)/words ≤ 2 % — гейт P2
  diarization:
    enabled: true
    required: true              # нет модели/токена ⇒ задание падает
    model: pyannote/speaker-diarization-community-1
    device: auto                # auto | cuda | cpu (на AMD/Intel → cpu)
    num_speakers: 0             # 0 = неизвестно (действуют min/max)
    min_speakers: 1
    max_speakers: 20
    block_minutes: 20           # длинные файлы режутся блоками 15–30 мин
    block_overlap_sec: 60       # сшивка спикеров между блоками
  cache:
    diarization: true           # не пересчитывать pyannote при смене ASR
  # --- Глоссарий (P3): детерминированные замены по словам после ASR ------------
  # `postprocess` меняет только `words[].text` и пересобирает `block.text`;
  # таймкоды/спикеры/alignment не трогаются, правки — в `<stem>.edits.json`.
  # variants — кандидаты: без `context` рядом, `allow_global` или `priority: high`
  # замена не применяется, случай уходит в edits.json как needs_review (§4.2).
  glossary:
    path: ""                    # "" = замены выключены (поведение P2).
                                # Рабочий глоссарий по умолчанию — data/glossary.yaml
                                # (data/* в .gitignore: там могут быть ФИО клиентов);
                                # пример формата — sidecar/hds_transcribe/glossary.example.yaml
    terms: []                   # явные термины (для тестов/переопределений)
  hotwords:
    enabled: false              # до ворот G1/G2 biasing выключен (P3_REPORT.md)
    backend: none               # none | gigastt (gigastt включается только после G1+G2)
    phrases: []                 # свои фразы; пусто → из глоссария (канон+pronunciations)
    max_phrases: 64             # жёсткий лимит gigastt (too_many_hotwords)
    max_phrase_chars: 64        # жёсткий лимит gigastt (hotword_phrase_too_long)
    boost: 5.0                  # additive logit boost (P0: эффект при 8)
    url: "http://127.0.0.1:9876"  # для backend: gigastt через HTTP (в CLI — файл)
  llm:
    enabled: false              # LLM-постобработка — P4

# --- Диаризация: Nemotron-3 (Sortformer v3, до 8 спикеров) --------------------
# Новый путь (W4/W5): llm_host декодирует медиа в WAV 16 кГц **один раз**, ASR идёт
# по срезу ведущей тишины, диаризация — по полному WAV; `.md` получает метки
# `### SPEAKER_NN [HH:MM:SS - HH:MM:SS]` (время от начала исходного файла).
# Модель ставит setup.ps1 (installers\fetch_nemotron3_model.ps1: 400 МБ, sha256
# проверяется установщиком и при загрузке). Формат вывода не меняется.
# `auto_transcribe.diarization*` выше действуют только для backend: sortformer.
diarization:
  backend: nemotron3        # nemotron3 | sortformer (legacy) | off
  required: true            # нет модели/сбой ⇒ задание падает (fallback в speech нет)
  nemotron3:
    model: ''               # '' → автопоиск: HDS_MODELS_DIR → %ProgramData%\hermes-disk-search\models → %APPDATA%\OpenResearchTools\models (\nemotron3\nemotron3_diar_v3.onnx)
    device: auto            # auto | cpu | directml (Windows) | coreml (macOS);
                            #   auto — GPU только для файлов ≥ min_audio_min (короткие на CPU быстрее)
    chunk_min: 10           # блок feed()/flush(), минуты (2..=30); память ~25 МБ/мин аудио
    min_audio_min: 2        # короче — CPU даже при device: auto
    onset: 0.5              # порог появления спикера
    offset: 0.5             # порог завершения реплики
  asr:                      # вход ASR (диаризация всегда по полному WAV, вариант A)
    trim_leading_silence: true   # срезать ведущую тишину перед ASR
    silence_threshold_db: -50    # порог кадра, dBFS
    trim_lead_in_sec: 0.3        # сколько оставить перед найденной речью
    drop_silent_segments: true   # энергетический постфильтр «реплик из тишины»

rerank:                     # реранкер ask_my_files (роль rerank; владелец — llm-host)
  enabled: false            # по умолчанию выключен
  url: "http://localhost:8012/v1"
  model: "bge-reranker-v2-m3"  # имя модели в теле запроса /v1/rerank (GGUF-файл — llm_server.rerank.model)
  timeout: 30
  max_latency: 15

watch:
  debounce_seconds: 8
  reconcile_on_start: true
  max_stable_wait: 120

# Интеграция с Cline: экономный режим поиска на «медленных» машинах.
cline:
  slow_machine: false        # true — правило slow-machine устанавливается при cline-sync:
                             #   один вызов инструмента за ход, limit ≤ 5, без web_search.
                             #   Включайте на машинах с интегрированной графикой (iGPU),
                             #   где ходы Cline не успевают за таймаутом клиента.
