# Воркспейс ядра hermes-disk-search (MIGRATION_PLAN_RUST.md §2.4).
#
# Внутри — только боевые крейты (W2 и дальше). Спайки W0
# (`tools/parity/spikes`) остаются отдельным крейтом вне воркспейса: у них свой
# Cargo.lock, свои версии крейтов и они не должны тянуть зависимости продукта.
[workspace]
resolver = "2"
members = ["crates/hds-core", "crates/hds-extract", "crates/hds-index", "crates/hds-llama", "crates/hds-cli", "crates/hds-clip", "crates/hds-diarize", "crates/hds-search", "crates/hds-mcp", "crates/hds-ui"]
exclude = ["tools/parity/spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
blake2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "load_extension"] }
sqlite-vec = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
libloading = "0.8"
walkdir = "2"
directories = "6"
nvml-wrapper = "0.13"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
# T1 (PLAN_M1_ACCESS_PROJECTS.md §3.2/§3.3): Argon2id для паролей, opaque-токены.
# rand_core с getrandom — включает OsRng для SaltString::generate (password-hash).
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"

# M5 T2 (PLAN_M5_EXTERNAL_CHAT.md §3.3): TLS-клиент для внешнего chat-API
# (chat.provider: remote). Только исходящие; входящие серверы без TLS
# (периметр = reverse-proxy, M3). ring — без aws-lc-rs (сборка проще).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

# sqlite-vec компилируется из C: без оптимизации скорость вставки/поиска
# падает в разы (грабля спайка 1, tools/parity/spikes/Cargo.toml).
[profile.dev.package.sqlite-vec]
opt-level = 2