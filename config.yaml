# hermes-disk-search — конфигурация
# Корни индексации (диски/папки). Добавляйте по одному на строку.
index:
  roots:
    - "D:\\"
  exclude_dirs: ["$RECYCLE.BIN", "System Volume Information", "node_modules", ".git", ".venv", "venv", "__pycache__", "AppData", "Windows", "Windows.old", "Recovery", ".cache", ".npm", ".nuget", "packages", "hermes-disk-search", "hermes-disk-search-db", "WindowsApps", "$WINDOWS.~BT", ".Trash", ".Trashes", "models"]
  # Исключаемые пути-префиксы (каталог или файл целиком; редактируется в UI):
  # exclude_paths:
  #   - 'D:\Backup\Downloads\opencv'
  #   - 'D:\Backup\Downloads\cmake-4.3.1'
  exclude_paths:
    - 'D:\Backup\Downloads'
    - 'D:\Soft'
  max_file_mb: 200          # предел для обычных файлов
  max_media_mb: 2500        # предел для аудио/видео (транскрипция)
  ocr: true                 # OCR картинок и пустых страниц PDF (нужен Tesseract + язык rus)
  ocr_lang: "rus+eng"
  ocr_tesseract_cmd: 'C:\Program Files\Tesseract-OCR\tesseract.exe'  # путь к tesseract.exe, если не в PATH
  transcribe: true          # транскрипция аудио/видео (нужен faster-whisper)
  whisper_model: small
  whisper_device: auto      # auto | cuda | vulkan | cpu | metal:
                            #   auto = CUDA → Vulkan (whisper.cpp, AMD/Intel) → CPU (int8);
                            #   vulkan = whisper.cpp; бэкенд ставится setup.ps1 или
                            #     'python -m hds.cli vulkan-setup' (GPU-ускорение для AMD/Intel);
                            #   metal = только macOS Apple Silicon через mlx-whisper
  # whisper_mlx_repo: 'mlx-community/whisper-small-mlx'  # MLX-веса для Metal (macOS, опционально)
  # whisper_cpp_dir: 'models\whisper-cpp'  # папка бинарника whisper.cpp + GGML-весов (Windows)
  whisper_compute: float16
  whisper_load_timeout: 180 # сек; при зависании CUDA-загрузки — автоматический fallback на CPU
  whisper_batch: 8          # батчевая транскрипция (ровная загрузка GPU, ускорение x3-5); 0 = отключить
  whisper_language: ""      # "" = авто-детекция языка; "ru" — фиксировать русский
                            # (надёжнее на tiny/base: авто-детект коротких фраз иногда ошибается)
  hf_token: ""              # опционально: токен HuggingFace (https://huggingface.co/settings/tokens) — быстрее загрузки моделей
  max_chunks: 3000          # максимум чанков на файл (гигантские тексты обрезаются; 0 = без лимита)

db_path: 'D:\hermes-disk-search-db\index.db'

chunk:
  size: 1200               # символов на чанк
  overlap: 200             # перекрытие между чанками

embedding:
  base_url: "http://localhost:1234/v1"   # LM Studio
  model: "text-embedding-bge-m3"         # BAAI bge-m3 GGUF (lm-kit), 1024 dim, 100+ языков
  batch_size: 64
  dim: 1024                # bge-m3 = 1024

chat:
  base_url: "http://localhost:1234/v1"
  model: "qwen3.5-9b@q6_k"
  temperature: 0.2
  max_context_chars: 14000

search:
  vec_k: 40                # глубина векторного поиска
  fts_k: 40                # глубина полнотекстового поиска
  rrf_k: 60                # константа слияния RRF
  fts_weight: 1.0          # вес FTS-ветки в слиянии
  vec_weight: 1.0          # вес векторной ветки в слиянии
  snippet_chars: 500

watch:
  debounce_seconds: 8      # ждать стабилизации файла после события записи
  reconcile_on_start: true # при старте watcher догонять пропущенное (быстрый stat-обход)
  max_stable_wait: 120