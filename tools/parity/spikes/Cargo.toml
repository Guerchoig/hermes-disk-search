# Спайки W0 (MIGRATION_PLAN_RUST.md §4 W0, §12): БД+sqlite-vec из Rust (спайк 1),
# паритет content_hash (спайк 2), probe DLL движка (спайк 6, частично).
[package]
name = "hds-spikes"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "load_extension"] }
sqlite-vec = "0.1.9"
blake2 = "0.10"
hex = "0.4"
libloading = "0.8"
serde_json = "1"

[profile.dev.package.sqlite-vec]
opt-level = 2