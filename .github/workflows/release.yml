name: Release

# Rust-first release (see RELEASING.md). Windows is the primary target and is
# BLOCKING: the product package plus BOTH Windows engine runtimes (CUDA + Vulkan)
# must be produced, otherwise no release is published. macOS is best-effort (not
# verified on real hardware yet - MIGRATION_PLAN_RUST.md section 10.0): the mac
# jobs are non-blocking and their assets are attached only when they succeed.
# Python core is gone; only the `sidecar/` worker is packaged (built by the
# build-sidecar-* jobs from hds/*.py + sidecar/).
#
# Trigger: version tag push (`git push origin vX.Y.Z`) or manual workflow_dispatch
# with a version input.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.18.0)'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ---------- Version: tag/input must equal __version__ in hds/__init__.py ------
  # (RELEASING.md section 3: the one source of the product version)
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version of the release equals hds/__init__.py
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          v="${VERSION#v}"
          want="$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' hds/__init__.py)"
          echo "release: $v / code: $want"
          if [ -z "$want" ]; then
            echo "::error::__version__ not found in hds/__init__.py"
            exit 1
          fi
          if [ "$v" != "$want" ]; then
            echo "::error::version mismatch: release '$v' vs hds/__init__.py '$want' (bump the version first, RELEASING.md 3)"
            exit 1
          fi

  # ---------- Rust: tests + lint (blocking: fmt/clippy -D warnings) ----------
  test-rust:
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: clippy (blocking, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  # ---------- Windows sidecar: portable CPython + worker + extractor modules ----------
  build-sidecar-windows:
    needs: [test-rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - name: Build self-contained sidecar
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installers\build_sidecar.ps1 -OutDir dist\sidecar -SelfTest

      - uses: actions/upload-artifact@v5
        with:
          name: hds-sidecar-windows
          path: dist/sidecar/**
          if-no-files-found: error

  # ---------- macOS sidecar (best-effort) ----------
  build-sidecar-macos:
    needs: [test-rust]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - name: Build self-contained sidecar (macOS)
        run: bash installers/build_sidecar_macos.sh dist/sidecar

      - uses: actions/upload-artifact@v5
        with:
          name: hds-sidecar-macos
          path: dist/sidecar/**
          if-no-files-found: error

  # ---------- Rust: Windows binaries + package (zip + sha256) ----------
  build-windows:
    needs: [test-rust, build-sidecar-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download sidecar
        uses: actions/download-artifact@v5
        with:
          name: hds-sidecar-windows
          path: sidecar_runtime

      - name: Build release and package (bin + sidecar + sha256 + zip)
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $ver = "$env:VERSION" -replace '^v', ''
          powershell -NoProfile -ExecutionPolicy Bypass -File installers\build_rust_release.ps1 -Version $ver -SidecarDir sidecar_runtime

      - name: "Smoke: unpacked archive - hds starts"
        shell: pwsh
        run: |
          $ver = "${{ inputs.version || github.ref_name }}" -replace '^v', ''
          Expand-Archive -Path "dist\hds-$ver-windows-x64.zip" -DestinationPath dist\check
          dist\check\bin\hds.exe --help
          # M9: внутрь поставки вложен клиентский пакет (канал «скачать с сервера»)
          if (-not (Test-Path "dist\check\client\hds-client-$ver-windows-x64.zip")) {
            throw "embedded client package is missing in the server archive"
          }
          Write-Host ("version.txt: " + (Get-Content dist\check\version.txt -Raw).Trim())

      - uses: actions/upload-artifact@v5
        with:
          name: hds-rust-windows-x64
          path: |
            dist/hds-*-windows-x64.zip
            dist/hds-*-windows-x64.zip.sha256.txt
          if-no-files-found: error

  # ---------- Rust: macOS binaries + package (best-effort) ----------
  build-macos:
    needs: [test-rust, build-sidecar-macos]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download sidecar (macOS)
        uses: actions/download-artifact@v5
        with:
          name: hds-sidecar-macos
          path: sidecar_runtime

      - name: Build release and package (bin + sidecar + sha256 + zip)
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          ver="${VERSION#v}"
          bash installers/build_rust_release_macos.sh "$ver" sidecar_runtime

      - uses: actions/upload-artifact@v5
        with:
          name: hds-rust-macos-arm64
          path: |
            dist/hds-*-macos-arm64.zip
            dist/hds-*-macos-arm64.zip.sha256.txt
          if-no-files-found: error

  # ---------- Engine runtime (llm-host + ASR) as release assets (offline installs) ----------
  # Windows is BLOCKING and ships BOTH backends from the pinned upstream manifest:
  # CUDA (NVIDIA) and Vulkan (AMD/Intel, machines without NVIDIA). A normal install
  # downloads the runtime itself (fetch_engine_runtime.ps1 -Backend auto picks by the
  # machine); these assets exist for OFFLINE installs (RELEASING.md section 2).
  fetch-engine-runtime-windows:
    needs: [test-rust]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, vulkan]
    steps:
      - uses: actions/checkout@v5

      - name: Download engine runtime (${{ matrix.backend }}) by manifest (sha256)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installers\fetch_engine_runtime.ps1 -EngineDir dist\engine-runtime -Backend ${{ matrix.backend }}

      - name: Package engine runtime (${{ matrix.backend }})
        shell: pwsh
        run: |
          Compress-Archive -Path dist\engine-runtime\* -DestinationPath dist\hds-engine-runtime-windows-x64-${{ matrix.backend }}.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: hds-engine-runtime-windows-x64-${{ matrix.backend }}
          path: dist/hds-engine-runtime-windows-x64-${{ matrix.backend }}.zip
          if-no-files-found: error

  # ---------- Engine runtime for macOS (best-effort) ----------
  fetch-engine-runtime-macos:
    needs: [test-rust]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Download engine runtime by manifest (sha256)
        shell: pwsh
        run: |
          pwsh -NoProfile -File installers/fetch_engine_runtime.ps1 -EngineDir dist/engine-runtime

      - name: Package engine runtime
        run: |
          cd dist/engine-runtime
          zip -r ../hds-engine-runtime-macos-arm64-metal.zip .

      - uses: actions/upload-artifact@v5
        with:
          name: hds-engine-runtime-macos-arm64
          path: dist/hds-engine-runtime-macos-arm64-metal.zip
          if-no-files-found: error

  # ---------- Release with binary assets (Windows blocking, macOS best-effort) ----------
  release:
    needs: [build-windows, fetch-engine-runtime-windows, build-macos, fetch-engine-runtime-macos]
    # Runs once the BLOCKING Windows jobs succeeded: the product package and BOTH
    # engine runtimes (CUDA + Vulkan). Missing/failed macOS jobs (best-effort)
    # simply do not contribute assets.
    if: ${{ always() && needs.build-windows.result == 'success' && needs.fetch-engine-runtime-windows.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows package
        uses: actions/download-artifact@v5
        with:
          name: hds-rust-windows-x64
          path: dist

      - name: Download Windows engine runtimes (CUDA + Vulkan)
        uses: actions/download-artifact@v5
        with:
          pattern: hds-engine-runtime-windows-x64-*
          path: dist
          merge-multiple: true

      - name: Download macOS package (best-effort)
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: hds-rust-macos-arm64
          path: dist

      - name: Download macOS engine runtime (best-effort)
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: hds-engine-runtime-macos-arm64
          path: dist

      - name: Source archives (Windows/macOS)
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          git archive --format=zip --prefix="hermes-disk-search/" -o "hermes-disk-search-$env:VERSION-windows.zip" HEAD
          git archive --format=zip --prefix="hermes-disk-search/" -o "hermes-disk-search-$env:VERSION-macos.zip" HEAD

      - name: Client bootstrap scripts into dist (public installers)
        shell: pwsh
        run: |
          # Скрипты, которые сервер отдаёт ПУБЛИЧНО (без токена) — их публикуем и
          # ассетом, чтобы «общедоступное место» было и без сервера.
          Copy-Item installers/client-install.ps1, installers/client-install.sh dist -Force
          Get-ChildItem dist -Filter "client-install.*" | ForEach-Object { Write-Host ("  " + $_.Name) }

      - name: Cross-embed both client packages into server archives
        shell: pwsh
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # В поставке должны лежать ОБА клиентских пакета (windows-x64 + macos-arm64):
          # тогда сервер выдаёт клиенту его платформу (см. hds_core::client::pick_package).
          # Каждый build-* собирает свой пакет сам, поэтому недостающий докладываем сюда
          # и пересчитываем sha256 серверного архива (он изменился).
          $ver = "$env:VERSION" -replace '^v', ''
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkgs = @(Get-ChildItem dist -Filter "hds-client-$ver-*.zip" -ErrorAction SilentlyContinue)
          if ($pkgs.Count -eq 0) { throw "no client packages found in dist" }
          Write-Host ("[..] client packages: " + (($pkgs | ForEach-Object { $_.Name }) -join ", "))
          $servers = @(Get-ChildItem dist -Filter "hds-*-windows-x64.zip" -ErrorAction SilentlyContinue) +
                     @(Get-ChildItem dist -Filter "hds-*-macos-arm64.zip" -ErrorAction SilentlyContinue) |
                     Where-Object { $_.Name -notlike "hds-client-*" }
          if (@($servers).Count -eq 0) { throw "no server archives found in dist" }
          foreach ($zip in $servers) {
            $changed = $false
            $archive = [System.IO.Compression.ZipFile]::Open($zip.FullName, 'Update')
            try {
              foreach ($p in $pkgs) {
                $entry = "client/" + $p.Name
                if ($archive.GetEntry($entry)) { continue }
                [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                  $archive, $p.FullName, $entry, [System.IO.Compression.CompressionLevel]::Optimal)
                $changed = $true
              }
            } finally { $archive.Dispose() }
            if (-not $changed) { Write-Host "[i] $($zip.Name): оба пакета уже внутри"; continue }
            $h = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($zip.Name)" | Set-Content -Encoding ascii "$($zip.FullName).sha256.txt"
            # Проверка: оба пакета реально внутри архива.
            $check = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
            try {
              foreach ($p in $pkgs) {
                if (-not $check.GetEntry("client/" + $p.Name)) {
                  throw "$($zip.Name): missing client/$($p.Name)"
                }
              }
            } finally { $check.Dispose() }
            Write-Host "[ok] $($zip.Name): вложены оба пакета, sha256 обновлён"
          }

      - name: Publish release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:VERSION
          $noV = $tag -replace '^v', ''
          $noteFile = "RELEASE_NOTES_$tag.md"
          if (-not (Test-Path $noteFile) -and (Test-Path "RELEASE_NOTES_$noV.md")) {
            $noteFile = "RELEASE_NOTES_$noV.md"
          }

          # Mandatory assets (RELEASING.md section 2): the Windows product package and
          # BOTH Windows engine runtimes. Fail loudly instead of publishing a release
          # that is missing what the rules promise.
          $mandatory = @(
            "hds-$noV-windows-x64.zip",
            "hds-$noV-windows-x64.zip.sha256.txt",
            "hds-client-$noV-windows-x64.zip",
            "hds-client-$noV-windows-x64.zip.sha256.txt",
            "client-install.ps1",
            "client-install.sh",
            "hds-engine-runtime-windows-x64-cuda.zip",
            "hds-engine-runtime-windows-x64-vulkan.zip"
          )
          $missing = @()
          foreach ($m in $mandatory) { if (-not (Test-Path (Join-Path dist $m))) { $missing += $m } }
          if ($missing.Count -gt 0) { throw "mandatory assets missing: $($missing -join ', ')" }

          $assets = @()
          $assets += Get-ChildItem dist -Filter "hds-*-windows-x64.zip*" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem dist -Filter "hds-engine-runtime-windows-*.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem dist -Filter "hds-*-macos-arm64.zip*" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem dist -Filter "client-install.*" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem dist -Filter "hds-engine-runtime-macos-*.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += "hermes-disk-search-$tag-windows.zip"
          $assets += "hermes-disk-search-$tag-macos.zip"
          Write-Host "[..] assets:"; $assets | ForEach-Object { Write-Host "  $_" }

          $exists = $false
          try {
            gh release view $tag *> $null
            $exists = ($LASTEXITCODE -eq 0)
          } catch {
            $exists = $false
          }
          if ($exists) {
            # Releases are never deleted (RELEASING.md section 3): re-running the
            # workflow only refreshes the assets of this version.
            Write-Host "[..] release $tag already exists - uploading/overwriting assets"
            gh release upload $tag @assets --clobber
          } elseif (Test-Path $noteFile) {
            gh release create $tag --title "$tag - hermes-disk-search" --target $env:GITHUB_SHA --notes-file $noteFile @assets
          } else {
            gh release create $tag --title "$tag - hermes-disk-search" --target $env:GITHUB_SHA --generate-notes @assets
          }

      - name: Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        shell: pwsh
        run: gh release view $env:VERSION

