name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например v0.2.0)'
        required: true
        type: string
      notes_file:
        description: 'Файл с заметками релиза (опционально)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install faster-whisper nvidia-cublas-cu12 nvidia-cudnn-cu12 psutil pyyaml

      - name: Компиляция всех модулей
        run: python -m compileall -q hds tools

      - name: Регрессионные тесты
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

  # Проверка совместимости с macOS (Apple Silicon M1-M4): зависимости ставятся
  # без nvidia-* (CUDA на Mac нет), тесты должны проходить без CUDA/Tesseract.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Python из Homebrew: сборки python.org (actions/setup-python на macOS)
      # собраны без поддержки загрузки расширений sqlite3 — sqlite-vec
      # не загрузится и векторный поиск будет недоступен.
      - name: Python 3.12 (Homebrew — sqlite3 с загрузкой расширений)
        run: |
          PY3="$(brew --prefix python@3.12 2>/dev/null)/bin/python3.12"
          if [ ! -x "$PY3" ]; then
            brew install python@3.12
            PY3="$(brew --prefix python@3.12)/bin/python3.12"
          fi
          "$PY3" -c "import sqlite3; c = sqlite3.connect(':memory:'); c.enable_load_extension(False); print('[ok] sqlite3: загрузка расширений доступна')"
          # PEP 668: brew-python запрещает pip без venv — создаём venv
          "$PY3" -m venv "$HOME/.hds-venv"
          echo "$HOME/.hds-venv/bin" >> "$GITHUB_PATH"

      - name: Установка зависимостей
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install faster-whisper psutil pyyaml

      - name: Компиляция всех модулей
        run: python3 -m compileall -q hds tools

      - name: Регрессионные тесты (macOS)
        env:
          PYTHONIOENCODING: utf-8
        run: python3 -m unittest discover -s tests -v

  # Архив для macOS собирается на macOS-раннере: git archive сохраняет права
  # на исполнение (.command, run_index) — это важно для Mac-архива.
  build-macos:
    needs: [test, test-macos]
    if: success()
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Архив релиза для macOS (исходники + иконки + инсталляторы)
        run: |
          VERSION="${{ inputs.version }}"
          git archive --format=zip --prefix="hermes-disk-search/" \
            -o "hermes-disk-search-${VERSION}-macos.zip" HEAD

      - uses: actions/upload-artifact@v5
        with:
          name: macos-archive
          path: hermes-disk-search-*-macos.zip
          if-no-files-found: error

  release:
    needs: [test, build-macos]
    if: success()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Скачивание macOS-ассетов
        uses: actions/download-artifact@v5
        with:
          name: macos-archive
          path: dist

      - name: Архив релиза для Windows (исходники + иконки + инсталляторы)
        env:
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          git archive --format=zip --prefix="hermes-disk-search/" `
            -o "hermes-disk-search-$env:VERSION-windows.zip" HEAD

      - name: Создание релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.version }}"
          # Заметки ищем в двух вариантах имени: RELEASE_NOTES_v0.10.0.md
          # (как в releasing.md и в релизах до 0.5.10) и RELEASE_NOTES_0.10.0.md
          # (вариант без префикса v, который использовался в 0.6.0–0.9.0).
          # Без второго варианта gh release create уходил на --generate-notes
          # и заметки молча не попадали в релиз (так было в 0.6.0–0.9.0).
          $noteFile = "RELEASE_NOTES_$tag.md"
          if (-not (Test-Path $noteFile)) {
            $noV = $tag -replace '^v', ''
            if (Test-Path "RELEASE_NOTES_$noV.md") {
              $noteFile = "RELEASE_NOTES_$noV.md"
            }
          }
          $macZip = Join-Path 'dist' "hermes-disk-search-$tag-macos.zip"
          $assets = @(
            "hermes-disk-search-$tag-windows.zip",
            $macZip
          )
          if (Test-Path $noteFile) {
            gh release create $tag --title "$tag — hermes-disk-search" --notes-file $noteFile @assets
          } else {
            gh release create $tag --title "$tag — hermes-disk-search" --generate-notes @assets
          }

      - name: Итог
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release list
