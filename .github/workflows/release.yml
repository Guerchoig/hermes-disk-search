name: Release

# Релиз hermes-disk-search: бинарные ассеты Rust (Windows) + рантайм движка,
# плюс (пока Python есть) регрессия эталона и mac-архив. W5 уберёт Python-джобы.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например v0.2.0)'
        required: true
        type: string
      notes_file:
        description: 'Файл с заметками релиза (опционально)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ---------- Python regression (kept until W5, per the migration plan) ----------
  test-py:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install faster-whisper nvidia-cublas-cu12 nvidia-cudnn-cu12 psutil pyyaml

      - name: Компиляция всех модулей
        run: python -m compileall -q hds tools

      - name: Регрессионные тесты
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

  # Проверка совместимости с macOS (Apple Silicon M1-M4): зависимости без nvidia-*.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Python из Homebrew: сборки python.org собраны без поддержки загрузки
      # расширений sqlite3 - sqlite-vec не загрузится и векторный поиск отключится.
      - name: Python 3.12 (Homebrew - sqlite3 with extension loading)
        run: |
          PY3="$(brew --prefix python@3.12 2>/dev/null)/bin/python3.12"
          if [ ! -x "$PY3" ]; then
            brew install python@3.12
            PY3="$(brew --prefix python@3.12)/bin/python3.12"
          fi
          "$PY3" -c "import sqlite3; c = sqlite3.connect(':memory:'); c.enable_load_extension(False); print('[ok] sqlite3: extension loading available')"
          "$PY3" -m venv "$HOME/.hds-venv"
          echo "$HOME/.hds-venv/bin" >> "$GITHUB_PATH"

      - name: Установка зависимостей
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install faster-whisper psutil pyyaml

      - name: Компиляция всех модулей
        run: python3 -m compileall -q hds tools

      - name: Регрессионные тесты (macOS)
        env:
          PYTHONIOENCODING: utf-8
        run: python3 -m unittest discover -s tests -v

  # ---------- Rust: tests + lint (blocking: fmt/clippy -D warnings) ----------
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Форматирование (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: clippy (блокирующий, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты Rust
        run: cargo test --workspace

  # ---------- Python sidecar: portable CPython + worker + extractor modules ----------
  build-sidecar:
    needs: [test-rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - name: Сборка самодостаточного sidecar (python + deps + модули извлечения)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installers\build_sidecar.ps1 -OutDir dist\sidecar -SelfTest

      - uses: actions/upload-artifact@v5
        with:
          name: hds-sidecar-windows
          path: dist/sidecar/**
          if-no-files-found: error

  # ---------- Rust: Windows binaries + package (zip + sha256) ----------
  build-windows:
    needs: [test-rust, build-sidecar]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Скачать sidecar
        uses: actions/download-artifact@v5
        with:
          name: hds-sidecar-windows
          path: sidecar_runtime

      - name: Сборка релиза и упаковка (bin + sidecar + sha256 + zip)
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ver = "$env:VERSION" -replace '^v', ''
          powershell -NoProfile -ExecutionPolicy Bypass -File installers\build_rust_release.ps1 -Version $ver -SidecarDir sidecar_runtime

      - name: "Smoke: распакованный архив - hds запускается"
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}" -replace '^v', ''
          Expand-Archive -Path "dist\hds-$ver-windows-x64.zip" -DestinationPath dist\check
          dist\check\bin\hds.exe --help

      - uses: actions/upload-artifact@v5
        with:
          name: hds-rust-windows-x64
          path: |
            dist/hds-*-windows-x64.zip
            dist/hds-*-windows-x64.zip.sha256.txt
          if-no-files-found: error

  # ---------- Engine runtime (llm-host + ASR) as a release asset (offline installs) ----------
  fetch-engine-runtime:
    needs: [test-rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Скачать рантайм движка по манифесту (sha256)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installers\fetch_engine_runtime.ps1 -EngineDir dist\engine-runtime

      - name: Упаковать рантайм движка
        shell: pwsh
        run: |
          Compress-Archive -Path dist\engine-runtime\* -DestinationPath dist\hds-engine-runtime-windows-x64-cuda.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: hds-engine-runtime-windows-x64
          path: dist/hds-engine-runtime-windows-x64-cuda.zip
          if-no-files-found: error

  # ---------- macOS source archive (kept until W5; git archive preserves exec bits) ----------
  build-macos:
    needs: [test-py, test-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Архив релиза для macOS (исходники + иконки + инсталляторы)
        run: |
          VERSION="${{ inputs.version }}"
          git archive --format=zip --prefix="hermes-disk-search/" -o "hermes-disk-search-${VERSION}-macos.zip" HEAD

      - uses: actions/upload-artifact@v5
        with:
          name: macos-archive
          path: hermes-disk-search-*-macos.zip
          if-no-files-found: error

  # ---------- Release with binary assets ----------
  release:
    needs: [test-py, build-windows, fetch-engine-runtime, build-macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Скачать бинарные ассеты (Windows)
        uses: actions/download-artifact@v5
        with:
          name: hds-rust-windows-x64
          path: dist

      - name: Скачать рантайм движка
        uses: actions/download-artifact@v5
        with:
          name: hds-engine-runtime-windows-x64
          path: dist

      - name: Скачать macOS-ассеты
        uses: actions/download-artifact@v5
        with:
          name: macos-archive
          path: dist

      - name: Архив исходников для Windows
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git archive --format=zip --prefix="hermes-disk-search/" -o "hermes-disk-search-$env:VERSION-windows.zip" HEAD

      - name: Создание релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.version }}"
          # Заметки: RELEASE_NOTES_<tag>.md или вариант без 'v' (0.6.0-0.9.0).
          $noteFile = "RELEASE_NOTES_$tag.md"
          if (-not (Test-Path $noteFile)) {
            $noV = $tag -replace '^v', ''
            if (Test-Path "RELEASE_NOTES_$noV.md") { $noteFile = "RELEASE_NOTES_$noV.md" }
          }
          $assets = @()
          $assets += Get-ChildItem dist -Filter "hds-*-windows-x64.zip" | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem dist -Filter "hds-*-windows-x64.zip.sha256.txt" | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem dist -Filter "hds-engine-runtime-*.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += "hermes-disk-search-$tag-windows.zip"
          $assets += (Join-Path 'dist' "hermes-disk-search-$tag-macos.zip")
          if (Test-Path $noteFile) {
            gh release create $tag --title "$tag - hermes-disk-search" --notes-file $noteFile @assets
          } else {
            gh release create $tag --title "$tag - hermes-disk-search" --generate-notes @assets
          }

      - name: Итог
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release list
