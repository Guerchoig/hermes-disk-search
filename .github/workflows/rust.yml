name: Rust CI

# Сборка и тесты Rust-воркспейса. Python-регрессия остаётся в ci.yml (пока Python
# есть); по мере миграции эта матрица становится основной (W4/W5 плана).
#
# Замечание: clippy запускается информативно (без -D warnings), т.к. очистка
# предупреждений и `cargo fmt` — отдельная задача W5 (очистка). Тесты и релизная
# сборка — блокирующие.

on:
  push:
    branches: [main, w2-llm-host]
  pull_request:
  workflow_dispatch:

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (информативно; -D warnings — задача W5)
        run: cargo clippy --workspace --all-targets

      - name: Тесты Rust
        run: cargo test --workspace

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Сборка релиза (hds, hds_mcp, llm_host)
        run: cargo build --release -p hds-cli -p hds-mcp -p hds-llama

      - name: Артефакты (Windows x64)
        uses: actions/upload-artifact@v5
        with:
          name: hds-rust-windows-x64
          path: |
            target/release/hds.exe
            target/release/hds_mcp.exe
            target/release/llm_host.exe
          if-no-files-found: error
