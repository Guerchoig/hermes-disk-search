name: Rust CI

# Rust-first workspace: fmt/clippy/tests are blocking. Python core is gone
# (only the `sidecar/` worker remains and it is built in Release). Windows is
# the ONLY shipped target (macOS is not released since 22.11.2026): there are
# no macOS jobs. Cross-platform code paths are still compiled/tested on ubuntu.

on:
  push:
    # Ветки, с которых собирается продукт и режется релиз (RELEASING.md §4):
    # `anonymizer-sidecar` — текущая ветка анонимизации (P1-P6, релиз 0.23.0);
    # `server-multiuser` — боевая ветка серверной подсистемы; `main` и
    # `w2-llm-host` — история (main = Python-эпоха, w2-llm-host = ядро на Rust).
    branches: [main, w2-llm-host, server-multiuser, python-sidecar-transcribe, anonymizer-sidecar, agent-privacy-zone]
  pull_request:
  workflow_dispatch:

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: clippy (blocking, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Shell wrappers syntax (bash -n)
        run: |
          # RELEASING.md section 7: macOS is not shipped anymore, but the legacy
          # .sh/.command wrappers stay in the tree for developers - a syntax error
          # must fail this blocking job, not a user's machine.
          for f in installers/*.sh installers/*.command; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
            echo "ok: $f"
          done

      - name: Compile all targets (cross-platform check, no run)
        # Продукт поставляется только под Windows, но не-Windows ветки должны
        # компилироваться (cfg-ошибки ловятся здесь). Windows-only тесты —
        # в джобе test-rust-windows: они проверяют пути C:\… и на Linux падают.
        run: cargo check --workspace --all-targets

  # ---------- Rust tests on the shipped platform (Windows) -------------------
  test-rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # AG6-14: тесты плана (`agent_run::project_registry_and_plan`) требуют
      # собранный `dist/worker.mjs`; без него они молча пропускаются — а именно
      # они проверяют проводку `disk-search` в настройки MCP.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sidecar/hds_agent/package-lock.json

      - name: Node worker (build for tests)
        run: |
          npm --prefix sidecar/hds_agent ci
          npm --prefix sidecar/hds_agent run build

      - name: Rust tests (Windows)
        run: cargo test --workspace

  # ---------- Python sidecar: unittest suite (P1-P6, blocking) ----------------
  # `sidecar/tests` covers the extractor/transcription/anonymization workers
  # without models: glossary, LLM patch validator (windows/word order/
  # allow_global), merge, quality, protocol, degradation, anonymize round-trip
  # (values mode needs python-docx/openpyxl/lxml, not the NER weights).
  # Model/HF-dependent tests must not land here.
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        # python-docx/openpyxl/lxml: `hds_anonymize.file_parser` imports them at
        # module level, so the anonymize tests cannot be skipped here.
        # pymorphy2 + setuptools<81: morphology/suffix tests (agent mode) expect
        # pymorphy2; it imports pkg_resources, removed in setuptools 81+.
        run: python -m pip install --disable-pip-version-check numpy PyYAML python-docx openpyxl lxml "pymorphy2==0.9.1" "setuptools>=75.0,<81"

      - name: Python sidecar tests (unittest)
        env:
          PYTHONPATH: sidecar
        run: python -m unittest discover sidecar/tests -v

  build-windows:
    needs: [test-rust, test-rust-windows, test-python]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release build (hds, hds_mcp, llm_host)
        run: cargo build --release -p hds-cli -p hds-mcp -p hds-llama

      - name: Artifacts (Windows x64)
        uses: actions/upload-artifact@v5
        with:
          name: hds-rust-windows-x64
          path: |
            target/release/hds.exe
            target/release/hds_mcp.exe
            target/release/llm_host.exe
          if-no-files-found: error
