name: Rust CI

# Rust-first workspace: fmt/clippy/tests are blocking. Python core is gone
# (only the `sidecar/` worker remains and it is built in Release). Windows is
# the primary target; macOS compiles but is not verified yet
# (MIGRATION_PLAN_RUST.md section 10.0) - the macOS job is best-effort
# (continue-on-error) and does not block the run.

on:
  push:
    # Ветки, с которых собирается продукт и режется релиз (RELEASING.md §4):
    # `server-multiuser` — текущая боевая ветка серверной подсистемы; `main` и
    # `w2-llm-host` — история (main = Python-эпоха, w2-llm-host = ядро на Rust).
    branches: [main, w2-llm-host, server-multiuser]
  pull_request:
  workflow_dispatch:

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: clippy (blocking, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Shell wrappers syntax (bash -n)
        run: |
          # RELEASING.md section 7: the shipped .sh/.command wrappers are only
          # exercised on macOS (a Windows dev machine has no bash) - a syntax
          # error must fail this blocking job, not the user's machine.
          for f in installers/*.sh installers/*.command; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
            echo "ok: $f"
          done

      - name: Rust tests
        run: cargo test --workspace

  test-rust-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests (macOS, best-effort - not verified yet)
        run: cargo test --workspace

  build-windows:
    needs: [test-rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release build (hds, hds_mcp, llm_host)
        run: cargo build --release -p hds-cli -p hds-mcp -p hds-llama

      - name: Artifacts (Windows x64)
        uses: actions/upload-artifact@v5
        with:
          name: hds-rust-windows-x64
          path: |
            target/release/hds.exe
            target/release/hds_mcp.exe
            target/release/llm_host.exe
          if-no-files-found: error

  build-macos:
    needs: [test-rust]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release build (macOS arm64, best-effort)
        run: cargo build --release -p hds-cli -p hds-mcp -p hds-llama

      - name: Artifacts (macOS arm64)
        uses: actions/upload-artifact@v5
        with:
          name: hds-rust-macos-arm64
          path: |
            target/release/hds
            target/release/hds_mcp
            target/release/llm_host
          if-no-files-found: error
